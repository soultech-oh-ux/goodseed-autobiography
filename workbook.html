<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multilingual Autobiography Workbook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#1f2937;--line:#d7dde5;--accent:#315b62;--paper:#fff;--soft:#f6f8fb}
*{box-sizing:border-box}
body{margin:0;background:#edf2f7;font-family:Arial,"Noto Sans KR","Noto Sans",sans-serif;color:var(--ink);line-height:1.55}
.top{position:sticky;top:0;z-index:100;background:#fff;padding:10px 12px 12px;border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.lang-guide{text-align:center;font-weight:800;font-size:15px;margin-bottom:9px;color:#334155}
.lang-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:1050px;margin:0 auto}
.langcard{border:0;border-radius:18px;color:#fff;padding:10px 8px;cursor:pointer;box-shadow:0 5px 12px rgba(15,23,42,.15);transition:.15s}
.langcard:hover{transform:translateY(-2px)} .langcard.active{outline:4px solid #111827;outline-offset:2px}
.langcard .icon{display:block;width:38px;height:32px;line-height:32px;margin:0 auto 5px;background:#fff;color:#1f2937;border-radius:10px;font-size:18px;font-weight:900}
.langcard .big{display:block;font-size:15px;font-weight:900} .langcard .small{display:block;font-size:10px;opacity:.9}
.ko{background:linear-gradient(145deg,#ff6b6b,#e74c3c)} .en{background:linear-gradient(145deg,#4f8cff,#2f62cf)}
.uz{background:linear-gradient(145deg,#21b889,#087e61)} .vi{background:linear-gradient(145deg,#ff9f43,#dd7313)}
.ne{background:linear-gradient(145deg,#9b5de5,#6f36b6)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.tools button{padding:9px 13px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}
.wrap{max-width:980px;margin:24px auto;background:#fff;padding:40px 52px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.cover{text-align:center;padding:34px 0 46px;border-bottom:2px solid var(--ink)}
.cover h1{font-size:38px;margin:0 0 8px} .cover p{font-size:19px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;text-align:left}
.meta input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:15px/1.5 Arial,sans-serif;background:#fff}
.day{margin-top:50px;page-break-before:always}
.dayhead{background:#f1f5f9;border-left:8px solid var(--accent);padding:12px 18px;margin-bottom:26px}
.dayhead h2{margin:4px 0 0;font-size:27px}
.section{margin:30px 0} .section h3{font-size:21px;border-bottom:2px solid var(--ink);padding-bottom:7px}
.q{margin:20px 0 27px;padding:14px;background:#fbfcfe;border:1px solid #edf0f4;border-radius:10px}
.qline{display:flex;gap:10px;align-items:flex-start} .n{min-width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.qt{flex:1;font-weight:800;padding:4px 5px;border-radius:4px} .qt[contenteditable="true"]{outline:2px dashed #d99b00;background:#fff9db}
.q textarea{min-height:110px;margin-top:10px;resize:vertical}
.final{margin-top:30px;padding:22px;background:#f8fafc;border:2px solid #d6e2ea;border-radius:12px}
.final h3{font-size:22px;margin-top:0} .final textarea{min-height:280px;resize:vertical}
.save{margin-top:12px;background:#315b62;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer}
.hint{font-size:12px;color:#667085;margin-top:8px}
@media(max-width:850px){.lang-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.lang-grid{grid-template-columns:repeat(2,1fr)}.wrap{margin:0;padding:20px 14px}.meta{grid-template-columns:1fr}.cover h1{font-size:30px}}
@media print{.top,.save{display:none!important}.wrap{box-shadow:none;margin:0;max-width:none;padding:12mm}}

.save-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.save-row .save{margin-top:0}
.pdfsave{background:#b42318!important}
</style>
</head>
<body>
<div class="top">
  <div class="lang-guide" id="langGuide"></div>
  <div class="lang-grid">
    <button class="langcard ko" data-lang="ko" onclick="setLang('ko')"><span class="icon">가</span><span class="big">한국어</span><span class="small">Korean</span></button>
    <button class="langcard en" data-lang="en" onclick="setLang('en')"><span class="icon">A</span><span class="big">English</span><span class="small">English</span></button>
    <button class="langcard uz" data-lang="uz" onclick="setLang('uz')"><span class="icon">O‘</span><span class="big">O‘zbekcha</span><span class="small">Uzbek</span></button>
    <button class="langcard vi" data-lang="vi" onclick="setLang('vi')"><span class="icon">V</span><span class="big">Tiếng Việt</span><span class="small">Vietnamese</span></button>
    <button class="langcard ne" data-lang="ne" onclick="setLang('ne')"><span class="icon">ने</span><span class="big">नेपाली</span><span class="small">Nepali</span></button>
  </div>
  <div class="tools">
    <button id="editBtn" onclick="toggleEdit()"></button>
    <button id="printBtn" onclick="window.print()"></button>
    <button id="clearBtn" onclick="clearAnswers()"></button>
  </div>
</div>

<main class="wrap">
  <section class="cover">
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="meta">
      <label><span id="nameLabel"></span><input id="studentName" type="text"></label>
      <label><span id="classLabel"></span><input id="studentClass" type="text"></label>
    </div>
  </section>
  <div id="content"></div>
</main>

let LANG=localStorage.getItem('bio_lang')||'ko';
let EDIT=false;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ansKey(d,q){return `bio_ans_d${d}_q${q}`;}
function finalKey(d){return `bio_final_d${d}`;}
function customQKey(lang,d,q){return `bio_customq_${lang}_d${d}_q${q}`;}
function customSKey(lang,d,s){return `bio_customs_${lang}_d${d}_s${s}`;}
function getQ(lang,d,q,def){return localStorage.getItem(customQKey(lang,d,q))||def}
function getS(lang,d,i,def){return localStorage.getItem(customSKey(lang,d,i))||def}

function render(){
  const L=LABELS[LANG];
  document.documentElement.lang=LANG==='ne'?'ne':LANG==='vi'?'vi':LANG==='uz'?'uz':LANG==='en'?'en':'ko';
  langGuide.textContent=LANG_GUIDE[LANG];
  document.querySelectorAll('.langcard').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
  title.textContent=L.title; sub.textContent=L.sub; nameLabel.textContent=L.name; classLabel.textContent=L.cls;
  editBtn.textContent=EDIT?L.done:L.edit; printBtn.textContent=L.print; clearBtn.textContent=L.clear;
  studentName.value=localStorage.getItem('bio_name')||'';
  studentClass.value=localStorage.getItem('bio_class')||'';

  let html='';
  [1,2,3].forEach(d=>{
    const qs=DATA[LANG][String(d)];
    html+=`<section class="day" data-day="${d}"><div class="dayhead"><b>${esc(L.day)} ${d}</b><h2>${esc(L.days[d-1])}</h2></div>`;
    let qIndex=0;
    for(let sec=0;sec<3;sec++){
      const sTitle=getS(LANG,d,sec,SECTIONS[LANG][sec]);
      html+=`<div class="section"><h3 class="stitle" data-sec="${sec}" contenteditable="${EDIT}">${esc(sTitle)}</h3>`;
      for(let j=0;j<15;j++){
        const q=qs[qIndex], qt=getQ(LANG,d,qIndex,q), ans=localStorage.getItem(ansKey(d,qIndex))||'';
        html+=`<div class="q"><div class="qline"><span class="n">${qIndex+1}</span><div class="qt" data-q="${qIndex}" contenteditable="${EDIT}">${esc(qt)}</div></div>
          <textarea data-q="${qIndex}" placeholder="${esc(L.placeholder)}">${esc(ans)}</textarea></div>`;
        qIndex++;
      }
      html+='</div>';
    }
    if(d===3 && qs.length>45){
      const q=qs[45], qt=getQ(LANG,d,45,q), ans=localStorage.getItem(ansKey(d,45))||'';
      const lastTitle=LANG==='ko'?'마지막 한 문장':LANG==='en'?'My Final Sentence':LANG==='uz'?'Mening so‘nggi jumlam':LANG==='vi'?'Câu cuối cùng của tôi':'मेरो अन्तिम वाक्य';
      html+=`<div class="section"><h3>${esc(lastTitle)}</h3>
        <div class="q"><div class="qline"><span class="n">46</span><div class="qt" data-q="45" contenteditable="${EDIT}">${esc(qt)}</div></div>
        <textarea data-q="45" placeholder="${esc(L.placeholder)}">${esc(ans)}</textarea></div></div>`;
    }
    html+=`<div class="final"><h3>${esc(L.final)} — ${esc(L.day)} ${d}</h3><p>${esc(L.help)}</p>
      <textarea class="finalText" placeholder="${esc(L.placeholder)}">${esc(localStorage.getItem(finalKey(d))||'')}</textarea>
      <div class="save-row">
        <button class="save" onclick="saveDayDocx(${d})">${esc(L.save)} — ${esc(L.day)} ${d}</button>
        <button class="save pdfsave" onclick="saveDayPdf(${d})">${esc(PDF_LABELS[LANG])} — ${esc(L.day)} ${d}</button>
      </div>
      <div class="hint">${d===3 ? esc(L.included.replace('45','46').replace('४५','४६')) : esc(L.included)}</div></div></section>`;
  });
  content.innerHTML=html;
  bindEvents();
}

function bindEvents(){
  studentName.oninput=()=>localStorage.setItem('bio_name',studentName.value);
  studentClass.oninput=()=>localStorage.setItem('bio_class',studentClass.value);
  document.querySelectorAll('.day').forEach(day=>{
    const d=+day.dataset.day;
    day.querySelectorAll('textarea[data-q]').forEach(t=>t.oninput=()=>localStorage.setItem(ansKey(d,+t.dataset.q),t.value));
    const f=day.querySelector('.finalText'); f.oninput=()=>localStorage.setItem(finalKey(d),f.value);
    if(EDIT){
      day.querySelectorAll('.qt').forEach(el=>el.oninput=()=>localStorage.setItem(customQKey(LANG,d,+el.dataset.q),el.innerText.trim()));
      day.querySelectorAll('.stitle').forEach(el=>el.oninput=()=>localStorage.setItem(customSKey(LANG,d,+el.dataset.sec),el.innerText.trim()));
    }
  });
}

function setLang(v){LANG=v;localStorage.setItem('bio_lang',v);render();}
function toggleEdit(){EDIT=!EDIT;render();}
function clearAnswers(){
  if(!confirm(LABELS[LANG].clearConfirm))return;
  Object.keys(localStorage).filter(k=>k.startsWith('bio_ans_')||k.startsWith('bio_final_')).forEach(k=>localStorage.removeItem(k));
  render();
}

function xmlEscape(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function p(text,bold=false,size=22){return `<w:p><w:r><w:rPr>${bold?'<w:b/>':''}<w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`}

async function saveDayDocx(d){
  if(typeof JSZip==='undefined'){alert(LABELS[LANG].docxError);return}
  const L=LABELS[LANG], qs=DATA[LANG][String(d)];
  let body=p(`${L.title} — ${L.day} ${d}`,true,32)+p(L.days[d-1],true,28);
  body+=p(`${L.name}: ${studentName.value||''}`)+p(`${L.cls}: ${studentClass.value||''}`);
  let qi=0;
  for(let sec=0;sec<3;sec++){
    body+=p(getS(LANG,d,sec,SECTIONS[LANG][sec]),true,26);
    for(let j=0;j<15;j++){
      body+=p(`${qi+1}. ${getQ(LANG,d,qi,qs[qi])}`,true,22);
      body+=p(localStorage.getItem(ansKey(d,qi))||' ',false,22);
      qi++;
    }
  }
  if(d===3 && qs.length>45){
    body+=p(`46. ${getQ(LANG,d,45,qs[45])}`,true,22);
    body+=p(localStorage.getItem(ansKey(d,45))||' ',false,22);
  }
  body+=p(`${L.final} — ${L.day} ${d}`,true,28);
  body+=p(localStorage.getItem(finalKey(d))||' ',false,22);

  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial"/></w:rPr></w:style></w:styles>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docrels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const zip=new JSZip(); zip.file('[Content_Types].xml',ct); zip.folder('_rels').file('.rels',rels);
  const word=zip.folder('word'); word.file('document.xml',doc); word.file('styles.xml',styles); word.folder('_rels').file('document.xml.rels',docrels);
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const safe=(studentName.value||'Student').replace(/[\\/:*?"<>|]+/g,'_');
  a.download=`${safe}_Autobiography_Day${d}_${LANG}.docx`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1200);
}

function saveDayPdf(d){
  const L=LABELS[LANG], qs=DATA[LANG][String(d)];
  const nameVal=studentName.value||'';
  const classVal=studentClass.value||'';
  let qi=0, sectionsHtml='';
  for(let sec=0;sec<3;sec++){
    sectionsHtml+=`<h2>${esc(getS(LANG,d,sec,SECTIONS[LANG][sec]))}</h2>`;
    for(let j=0;j<15;j++){
      const qText=getQ(LANG,d,qi,qs[qi]);
      const ans=(localStorage.getItem(ansKey(d,qi))||'').replace(/\n/g,'<br>');
      sectionsHtml+=`<div class="pdf-q"><div class="pdf-question"><b>${qi+1}. ${esc(qText)}</b></div><div class="pdf-answer">${ans||'&nbsp;'}</div></div>`;
      qi++;
    }
  }
  if(d===3 && qs.length>45){
    const title46=LANG==='ko'?'마지막 한 문장':LANG==='en'?'My Final Sentence':LANG==='uz'?'Mening so‘nggi jumlam':LANG==='vi'?'Câu cuối cùng của tôi':'मेरो अन्तिम वाक्य';
    const qText=getQ(LANG,d,45,qs[45]);
    const ans=(localStorage.getItem(ansKey(d,45))||'').replace(/\n/g,'<br>');
    sectionsHtml+=`<h2>${esc(title46)}</h2><div class="pdf-q"><div class="pdf-question"><b>46. ${esc(qText)}</b></div><div class="pdf-answer">${ans||'&nbsp;'}</div></div>`;
  }
  const finalText=(localStorage.getItem(finalKey(d))||'').replace(/\n/g,'<br>');
  const w=window.open('','_blank');
  if(!w){alert('Please allow pop-ups to save the PDF.');return;}
  w.document.write(`<!doctype html><html lang="${LANG}"><head><meta charset="utf-8">
  <title>${esc(L.title)} - ${esc(L.day)} ${d}</title>
  <style>
  @page{size:A4;margin:16mm}
  body{font-family:Arial,"Noto Sans KR","Noto Sans",sans-serif;color:#111827;line-height:1.55;font-size:12pt}
  h1{text-align:center;font-size:22pt;margin:0 0 8px}.subtitle{text-align:center;font-size:14pt;margin-bottom:22px}
  .meta{border:1px solid #cbd5e1;padding:10px 12px;margin-bottom:20px;border-radius:6px}
  h2{font-size:15pt;border-bottom:2px solid #334155;padding-bottom:5px;margin-top:24px}
  .pdf-q{break-inside:avoid;margin:12px 0 16px}.pdf-question{margin-bottom:5px}
  .pdf-answer{min-height:32px;border:1px solid #d7dde5;border-radius:5px;padding:8px;background:#fafafa}
  .final{margin-top:28px;border:2px solid #94a3b8;border-radius:8px;padding:14px}
  </style></head><body>
  <h1>${esc(L.title)}</h1><div class="subtitle">${esc(L.days[d-1])}</div>
  <div class="meta"><b>${esc(L.name)}:</b> ${esc(nameVal)}<br><b>${esc(L.cls)}:</b> ${esc(classVal)}</div>
  ${sectionsHtml}
  <div class="final"><h2>${esc(L.final)} — ${esc(L.day)} ${d}</h2><div>${finalText||'&nbsp;'}</div></div>
  </body></html>`);
  w.document.close(); w.focus(); setTimeout(()=>w.print(),350);
}

render();
</script>
